name: publish

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.gate.outputs.version }}
      should_publish: ${{ steps.gate.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - id: gate
        run: node scripts/publish-gate.mjs

  publish:
    needs: build-test
    if: needs.build-test.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npm version "${{ needs.build-test.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm publish --dry-run
      # No --provenance and no NODE_AUTH_TOKEN: this package is registered on
      # npm for trusted publishing from this workflow, so npm authenticates
      # over OIDC (which is what permissions: id-token: write above is for)
      # and attaches the provenance attestation itself. Adding --provenance
      # back here would be redundant, not a fix for a missing one — if a
      # publish ever needs it added back, the trusted publisher config on
      # npmjs.com is what to check first, not this file.
      - run: npm publish --access public
      - name: tag the commit this version published from
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.build-test.outputs.version }}"
          git push origin "v${{ needs.build-test.outputs.version }}"
